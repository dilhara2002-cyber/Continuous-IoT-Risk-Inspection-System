<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Secure IoT Device Discovery & Risk Management</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div style="font-size: 2.5rem; margin-bottom: 0.5rem;">🛡️</div>
        <h2>Secure IoT System</h2>
        <p>Smart Office Discovery & Risk Management (Group 14)</p>
      </div>

      <div id="login-error" class="login-error"></div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-input" placeholder="e.g. admin" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-input" placeholder="••••••••" required>
        </div>

        <button type="submit" id="login-btn" class="btn" style="width: 100%; justify-content: center; padding: 0.75rem;">
          Sign In to Dashboard
        </button>
      </form>

      <div class="preset-login-hint">
        <p style="margin-bottom: 0.35rem;"><strong>University Evaluation Accounts:</strong></p>
        <p>• <strong>Administrator:</strong> <code>admin</code> / <code>AdminPassword123!</code></p>
        <p>• <strong>Viewer:</strong> <code>viewer</code> / <code>ViewerPassword123!</code></p>
      </div>
    </div>
  </div>

  <script src="/static/js/auth.js"></script>
  <script>
    // Redirect if already authenticated
    checkAuth(false);

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const errEl = document.getElementById("login-error");
      const btn = document.getElementById("login-btn");
      errEl.style.display = "none";
      btn.disabled = true;
      btn.innerText = "Signing in...";

      const username = document.getElementById("username").value.trim();
      const password = document.getElementById("password").value;

      try {
        await handleLogin(username, password);
        window.location.href = "/";
      } catch (err) {
        errEl.innerText = err.message;
        errEl.style.display = "block";
        btn.disabled = false;
        btn.innerText = "Sign In to Dashboard";
      }
    });
  </script>
</body>
</html>
